# Publishes the package to npm with a provenance statement when a version tag
# (e.g. 1.0.0) is pushed. n8n requires community nodes to be published from
# GitHub Actions with provenance (from 1 May 2026). Actions are pinned to full
# commit SHAs.
#
# Two jobs, so no dependency code runs where a publish token exists:
# - build: no id-token permission and no npm token. Installs, lints, tests,
#   builds and packs the .tgz.
# - publish: id-token: write (provenance, Trusted Publishing). Installs
#   nothing and runs no package scripts; it only publishes the .tgz from build.
#
# npm authentication: Trusted Publishing (OIDC, no secret) once the package
# exists on npm; for the first release only, a granular token in the NPM_TOKEN
# secret, revoked afterwards.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

permissions: {}

jobs:
  build:
    name: Build and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3' # no dependency cache in a release workflow

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts # no dependency install scripts at all

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack
        run: npm pack

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: n8n-nodes-appruvit-${{ github.ref_name }}.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance and Trusted Publishing

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3' # npm 11.19.1 (Trusted Publishing needs npm 11.5.1 or later)

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - name: Publish
        run: |
          if [ -n "$NPM_TOKEN" ]; then npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"; fi
          npm publish "n8n-nodes-appruvit-$GITHUB_REF_NAME.tgz" --provenance --access public --ignore-scripts
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
